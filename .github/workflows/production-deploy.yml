name: Delly Belly Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

jobs:
  build-test-deploy:
    name: Compile, Test & Deploy .NET API
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3: Restore NuGet Packages
      - name: Restore NuGet Packages
        run: dotnet restore DellyBellyAPI/DellyBelly.API.csproj

      # Step 4: Compile/Build Application in Release Mode
      - name: Compile API Project
        run: dotnet build DellyBellyAPI/DellyBelly.API.csproj --configuration Release --no-restore

      # Step 5: Run Unit Tests (Optional - uncomment when tests are ready)
      # - name: Run Unit Tests
      #   run: dotnet test DellyBelly.UnitTests/DellyBelly.UnitTests.csproj --configuration Release --no-build

      # Step 6: Publish Compiled Web Deploy Files
      - name: Publish API Release
        run: dotnet publish DellyBellyAPI/DellyBelly.API.csproj -c Release -o ./publish

      # Step 6.1: Configure QA Environment Configuration
      - name: Configure QA Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: python
        run: |
          import os
          import re

          web_config_path = "./publish/web.config"
          if os.path.exists(web_config_path):
              with open(web_config_path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              # Find and replace ASPNETCORE_ENVIRONMENT value
              if 'name="ASPNETCORE_ENVIRONMENT"' in content:
                  content = re.sub(
                      r'(<environmentVariable\s+name="ASPNETCORE_ENVIRONMENT"\s+value=")[^"]+(")',
                      r'\g<1>Staging\g<2>',
                      content
                  )
                  print("Configured web.config environment to Staging.")
              else:
                  print("ASPNETCORE_ENVIRONMENT variable not found in web.config to replace.")
                  
              with open(web_config_path, "w", encoding="utf-8") as f:
                  f.write(content)
          else:
              print("web.config not found in publish directory!")

          prod_settings = "./publish/appsettings.Production.json"
          if os.path.exists(prod_settings):
              os.remove(prod_settings)
              print("Deleted appsettings.Production.json from QA publish bundle.")

      # Step 6.2: Configure Production Environment Configuration
      - name: Configure Production Environment
        if: github.ref == 'refs/heads/production' && github.event_name == 'push'
        shell: python
        run: |
          import os

          staging_settings = "./publish/appsettings.Staging.json"
          if os.path.exists(staging_settings):
              os.remove(staging_settings)
              print("Deleted appsettings.Staging.json from Production publish bundle.")


      # Step 6.5: Place App Offline (Production)
      - name: Place App Offline (Production)
        if: github.ref == 'refs/heads/production' && github.event_name == 'push'
        env:
          FTP_SERVER: ${{ secrets.PRODUCTION_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          TARGET_DIR: /wwwroot
        shell: python
        run: |
          import ftplib
          import io
          import time
          import os
          import sys
          import ssl

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          target_dir = os.environ['TARGET_DIR']

          print(f"Connecting to {server}...")
          try:
              try:
                  print("Trying FTPS (FTP over TLS)...")
                  context = ssl._create_unverified_context()
                  ftp = ftplib.FTP_TLS(context=context)
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  ftp.prot_p()
                  print("Connected using FTPS!")
              except Exception as ftps_err:
                  print(f"FTPS failed: {ftps_err}. Retrying with plain FTP...")
                  ftp = ftplib.FTP()
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  print("Connected using plain FTP!")

              print(f"Changing directory to {target_dir}...")
              try:
                  ftp.cwd(target_dir)
              except Exception as e:
                  print(f"Could not change directory to {target_dir}: {e}")
                  print("Root directories:")
                  ftp.dir()
                  raise e

              print("Uploading app_offline.htm...")
              content = "<h1>Delly Belly API is temporarily offline for maintenance. We will be back shortly!</h1>"
              bio = io.BytesIO(content.encode('utf-8'))
              ftp.storbinary('STOR app_offline.htm', bio)
              print("app_offline.htm uploaded successfully!")
              
              ftp.quit()
              print("Waiting 5 seconds for IIS to release locks...")
              time.sleep(5)
          except Exception as e:
              print(f"Error placing app offline: {e}")
              sys.exit(1)

      # Step 6.6: Place App Offline (QA)
      - name: Place App Offline (QA)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          FTP_SERVER: ${{ secrets.QA_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.QA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.QA_FTP_PASSWORD }}
          TARGET_DIR: /wwwroot
        shell: python
        run: |
          import ftplib
          import io
          import time
          import os
          import sys
          import ssl

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          target_dir = os.environ['TARGET_DIR']

          print(f"Connecting to {server}...")
          try:
              try:
                  print("Trying FTPS (FTP over TLS)...")
                  context = ssl._create_unverified_context()
                  ftp = ftplib.FTP_TLS(context=context)
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  ftp.prot_p()
                  print("Connected using FTPS!")
              except Exception as ftps_err:
                  print(f"FTPS failed: {ftps_err}. Retrying with plain FTP...")
                  ftp = ftplib.FTP()
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  print("Connected using plain FTP!")

              print(f"Changing directory to {target_dir}...")
              try:
                  ftp.cwd(target_dir)
              except Exception as e:
                  print(f"Could not change directory to {target_dir}: {e}")
                  print("Root directories:")
                  ftp.dir()
                  raise e

              print("Uploading app_offline.htm...")
              content = "<h1>Delly Belly API is temporarily offline for maintenance. We will be back shortly!</h1>"
              bio = io.BytesIO(content.encode('utf-8'))
              ftp.storbinary('STOR app_offline.htm', bio)
              print("app_offline.htm uploaded successfully!")
              
              ftp.quit()
              print("Waiting 5 seconds for IIS to release locks...")
              time.sleep(5)
          except Exception as e:
              print(f"Error placing app offline: {e}")
              sys.exit(1)

      # Step 7: Deploy Production to ASPMonster (FTP/SFTP)
      - name: Deploy Production to ASPMonster via FTP
        if: github.ref == 'refs/heads/production' && github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PRODUCTION_FTP_SERVER }}
          username: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false

      # Step 8: Deploy QA to tryasp.net (FTP/SFTP)
      - name: Deploy QA Preview to tryasp.net via FTP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.QA_FTP_SERVER }}
          username: ${{ secrets.QA_FTP_USERNAME }}
          password: ${{ secrets.QA_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false

      # Step 9: Remove App Offline (Production)
      - name: Remove App Offline (Production)
        if: always() && github.ref == 'refs/heads/production' && github.event_name == 'push'
        env:
          FTP_SERVER: ${{ secrets.PRODUCTION_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          TARGET_DIR: /wwwroot
        shell: python
        run: |
          import ftplib
          import os
          import sys
          import ssl

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          target_dir = os.environ['TARGET_DIR']

          print(f"Connecting to {server}...")
          try:
              try:
                  print("Trying FTPS (FTP over TLS)...")
                  context = ssl._create_unverified_context()
                  ftp = ftplib.FTP_TLS(context=context)
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  ftp.prot_p()
                  print("Connected using FTPS!")
              except Exception as ftps_err:
                  print(f"FTPS failed: {ftps_err}. Retrying with plain FTP...")
                  ftp = ftplib.FTP()
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  print("Connected using plain FTP!")

              print(f"Changing directory to {target_dir}...")
              ftp.cwd(target_dir)

              print("Deleting app_offline.htm...")
              try:
                  ftp.delete('app_offline.htm')
                  print("app_offline.htm deleted successfully!")
              except Exception as e:
                  print(f"Could not delete app_offline.htm: {e}")

              ftp.quit()
          except Exception as e:
              print(f"Error removing app offline: {e}")

      # Step 10: Remove App Offline (QA)
      - name: Remove App Offline (QA)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          FTP_SERVER: ${{ secrets.QA_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.QA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.QA_FTP_PASSWORD }}
          TARGET_DIR: /wwwroot
        shell: python
        run: |
          import ftplib
          import os
          import sys
          import ssl

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          target_dir = os.environ['TARGET_DIR']

          print(f"Connecting to {server}...")
          try:
              try:
                  print("Trying FTPS (FTP over TLS)...")
                  context = ssl._create_unverified_context()
                  ftp = ftplib.FTP_TLS(context=context)
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  ftp.prot_p()
                  print("Connected using FTPS!")
              except Exception as ftps_err:
                  print(f"FTPS failed: {ftps_err}. Retrying with plain FTP...")
                  ftp = ftplib.FTP()
                  ftp.connect(server, 21, timeout=30)
                  ftp.login(username, password)
                  print("Connected using plain FTP!")

              print(f"Changing directory to {target_dir}...")
              ftp.cwd(target_dir)

              print("Deleting app_offline.htm...")
              try:
                  ftp.delete('app_offline.htm')
                  print("app_offline.htm deleted successfully!")
              except Exception as e:
                  print(f"Could not delete app_offline.htm: {e}")

              ftp.quit()
          except Exception as e:
              print(f"Error removing app offline: {e}")
